[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visitlock"
version = "0.1.0"
description = "Confirm research visits by phone — structured RSVPs via CALL-E"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VisitLock contributors" }]
dependencies = [
  "calle-ai>=0.1.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
visitlock = "visitlock.cli:main"

[tool.setuptools.packages.find]
include = ["visitlock*"]

[tool.setuptools.package-data]
visitlock = ["data/*.csv"]
